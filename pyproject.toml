[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scopeglass"
version = "0.1.0"
description = "Small factorial experiments for the grammar inside language models"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Isaac Lee"}]
dependencies = []

[project.optional-dependencies]
models = ["torch>=2.6", "transformers>=4.51,<5"]
dev = ["pytest>=8", "ruff>=0.11", "build>=1.2"]

[project.scripts]
scopeglass = "scopeglass.cli:main"

[tool.setuptools.package-data]
scopeglass = ["report.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
